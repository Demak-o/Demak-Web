<!doctype html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rocket Calculator • Rust Helper</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="navbar">
    <nav class="nav-inner">
      <a class="brand" href="./index.html">Rust Helper</a>
      <div class="navlinks">
        <a href="./index.html">Home</a>
        <a class="active" href="./rocket.html">Rocket Cost</a>
        <a href="./raid.html">Raid Cost</a>
        <a href="./eco.html">Eco Raid</a>
        <a href="./new.html">New</a>
      </div>
    </nav>
  </header>

  <main class="container">
    <h1>Rocket Calculator</h1>
    <p>Calculate the amount of resources required to craft a certain amount of rockets.</p>

    <div class="card">
      <div class="grid">
        <label>
          <span>How many rockets do you want</span>
          <input id="Entry1" type="number" min="0" step="1" placeholder="e.g. 4">
        </label>

        <label>
          <span>How much sulfur do you already have, can be 0</span>
          <input id="Entry2" type="number" min="0" step="1" placeholder="e.g. 2000">
        </label>

        <label>
          <span>How much gunpowder do you already have, can be 0</span>
          <input id="Entry3" type="number" min="0" step="1" placeholder="e.g. 100">
        </label>
      </div>

      <div class="row">
        <button id="calc" class="btn primary">Calculate</button>
        <button id="reset" class="btn">Reset</button>
      </div>

      <div class="results">
        <div id="fs">Sulfur Required:</div>
        <div id="ch">Charcoal:</div>
        <div id="mp">Metal Pipes:</div>
        <div id="lg">Low Grade:</div>
        <div id="mf">Metal Frags:</div>
        <div id="err" class="error" hidden></div>
      </div>
    </div>
  </main>

  <script src="./rocket.js"></script>
</body>
</html>
